<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARA AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #17132d, #050507 65%);
  color: white;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 600px;
  min-height: 100vh;
  padding: 35px 20px 25px;
  display: flex;
  flex-direction: column;
}

.logo {
  text-align: center;
  margin-top: 60px;
}

.logo-icon {
  width: 80px;
  height: 80px;
  margin: auto;
  border-radius: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(135deg, #00eaff, #8b5cf6, #ff3cac);
  box-shadow: 0 0 35px rgba(139, 92, 246, 0.45);
}

h1 {
  margin-top: 20px;
  font-size: 38px;
  letter-spacing: 3px;
}

.tagline {
  margin-top: 8px;
  color: #aaa;
  font-size: 14px;
  letter-spacing: 2px;
}

.welcome {
  text-align: center;
  margin-top: 100px;
}

.welcome h2 {
  font-size: 30px;
  margin-bottom: 12px;
}

.welcome p {
  color: #888;
  font-size: 17px;
}

.chat {
  margin-top: 35px;
}

.input-box {
  display: flex;
  align-items: center;
  background: #111116;
  border: 1px solid #292933;
  border-radius: 28px;
  padding: 8px 10px 8px 18px;
}

.input-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 14px 5px;
}

.input-box input::placeholder {
  color: #777;
}

.send {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  background: linear-gradient(135deg, #00eaff, #8b5cf6);
  color: white;
  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 18px;
  background: #101016;
  border: 1px solid #272733;
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.status {
  color: #aaa;
}

footer {
  margin-top: auto;
  padding-top: 30px;
  text-align: center;
  color: #555;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">
    <div class="logo-icon">K</div>
    <h1>KARA AI</h1>
    <div class="tagline">THINK · TALK · SOLVE</div>
  </div>

  <div class="welcome">
    <h2>How can I help you?</h2>
    <p>Ask KARA anything...</p>
  </div>

  <div class="chat">

    <div class="input-box">
      <input
        id="question"
        type="text"
        placeholder="Ask KARA..."
        autocomplete="off"
      >

      <button class="send" id="sendButton" onclick="askKara()">
        ➤
      </button>
    </div>

    <div class="result" id="result"></div>

  </div>

  <footer>
    KARA AI · Your AI Assistant
  </footer>

</div>

<script>
let chatHistory = [];

async function askKara() {

  const input = document.getElementById("question");
  const result = document.getElementById("result");
  const button = document.getElementById("sendButton");

  const message = input.value.trim();

  if (!message) return;

  result.style.display = "block";
  result.innerHTML = '<span class="status">🤖 KARA is thinking...</span>';

  button.disabled = true;
  input.disabled = true;

  try {

    const response = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message,
        history: chatHistory
      })
    });

    const data = await response.json();

    if (data.reply) {

      result.textContent = "🤖 KARA:\n\n" + data.reply;

      chatHistory.push({
        role: "user",
        content: message
      });

      chatHistory.push({
        role: "assistant",
        content: data.reply
      });

    } else {

      result.textContent =
        "❌ KARA brain error\n\n" +
        (data.error || "No response received.");

    }

  } catch (error) {

    result.textContent =
      "❌ Connection error.\n\nPlease try again.";

  }

  button.disabled = false;
  input.disabled = false;
  input.focus();
}

document.getElementById("question").addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    askKara();
  }

});
</script>

</body>
</html>
